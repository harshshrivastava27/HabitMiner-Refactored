plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'     // Kotlin Symbol Processing for Room
    id 'com.google.dagger.hilt.android'
    id 'com.diffplug.spotless'
}

android {
    namespace 'com.habitminer'
    compileSdk 36

    defaultConfig {
        applicationId "com.habitminer.extended"
        minSdk 26           // Android 8.0 — required for WorkManager background execution guarantees
        targetSdk 35
        versionCode 200
        versionName "2.0.0-dev"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'net.bytebuddy.experimental', 'true'
        }
    }

    // One shared debug key for everyone (CI, teammates). Without it every machine and every
    // CI run signs with a different random key, and Android refuses to install the new APK
    // over the old one ("package conflicts with an existing package"). Debug-only, not secret.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        // The build people install: R8-shrunk and non-debuggable, which is much faster than the
        // debug build. Until the private release key is set up it is signed with the shared
        // debug key so CI can produce it.
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }


    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

// Export Room's schema so database migrations can be checked against it (see CI).
ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

spotless {
    kotlin {
        target '**/*.kt'
        ktlint()
    }
}

dependencies {
    // ==================== Jetpack Compose ====================
    def composeBom = platform('androidx.compose:compose-bom:2025.12.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material3:material3-adaptive-navigation-suite'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.navigation:navigation-compose:2.8.5'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // ==================== Core AndroidX ====================
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'

    // ==================== Room Database ====================
    // Opt-in, read-only sleep from Health Connect.
    implementation "androidx.health.connect:connect-client:1.1.0"

    def room_version = "2.8.3"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"         // Coroutines support for Room
    ksp "androidx.room:room-compiler:$room_version"               // KSP annotation processor

    // ==================== WorkManager ====================
    implementation 'androidx.work:work-runtime-ktx:2.10.0'

    // ==================== Data Serialization ====================
    implementation 'com.google.code.gson:gson:2.10.1'

    // ==================== Immutable Collections ====================
    implementation 'org.jetbrains.kotlinx:kotlinx-collections-immutable:0.3.7'

    // ==================== Coroutines ====================
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'

    // ==================== Testing ====================
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.3.1'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    // Screenshot tests: render Compose screens on the JVM with Robolectric (native graphics)
    testImplementation composeBom
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'androidx.test.ext:junit:1.1.5'

    // Room test helpers
    testImplementation "androidx.room:room-testing:$room_version"

    // ==================== Dependency Injection ====================
    implementation 'com.google.dagger:hilt-android:2.57.2'
    ksp 'com.google.dagger:hilt-compiler:2.57.2'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    // ==================== Hilt WorkManager ====================
    implementation 'androidx.hilt:hilt-work:1.2.0'
    ksp 'androidx.hilt:hilt-compiler:1.2.0'
}
