name: Release

# Publishes a signed APK when a version tag like v2.1.0 is pushed. The app's update check reads
# these releases, so the tag is the version: v2.1.0 becomes versionCode 20100.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: v
        run: |
          TAG="${GITHUB_REF_NAME}"
          IFS=. read -r MAJ MIN PAT <<< "${TAG#v}"
          echo "code=$((MAJ * 10000 + MIN * 100 + PAT))" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Decode the signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_B64 is not set. Releases must be signed with the private key so installed apps accept the update."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease -Pvcode=${{ steps.v.outputs.code }} -Pvname=${{ steps.v.outputs.name }}

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="HabitMinerExtended-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/*.apk "$APK"
          # The notes are the commit messages since the previous tag.
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}${GITHUB_REF_NAME}
          git log --no-merges --pretty='- %s' "$RANGE" | grep -v -i 'co-authored' | head -30 > notes.md
          gh release create "$GITHUB_REF_NAME" "$APK" --title "HabitMiner Extended ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
